name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate published skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The load-bearing check. The .gitignore allowlist keeps third-party
      # skills out of this public repository; this fails if anything outside
      # the allowlist is ever tracked, if a credential-shaped string is
      # committed, and if a published skill's frontmatter, CHANGELOG entry or
      # README row disagree.
      - name: Validate published skills
        run: python3 scripts/validate_skills.py

      # The commit hook runs this on the staged set, so a file that grows past
      # the budget in a merge, a web edit, or a clone with the hook uninstalled
      # is caught by nothing. --all makes it a whole-repo check.
      - name: File-size budget
        run: python3 repo-audit/scripts/check_file_size.py --all

      - name: skills.json is valid JSON
        run: python3 -m json.tool skills.json > /dev/null

      # Attribution cannot be allowed to drift from the record. A credits
      # file that names the wrong author is worse than no credits file, so the
      # generated document is checked rather than trusted.
      - name: ATTRIBUTION.md matches skills.json
        run: python3 scripts/attribution.py --check

      - name: Installer parses and its commands are well formed
        run: ./install-skills.sh --dry-run

      # Informational: reports which skills are tagged and which are due for a
      # release. The Release workflow is what actually tags.
      - name: Report release status
        run: python3 scripts/release_skills.py --check || true
